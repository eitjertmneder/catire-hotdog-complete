worker_processes auto;

events { 
  worker_connections 1024; 
}

http {
  resolver 127.0.0.11 valid=5s;
  
  sendfile on;

  server {
    listen 80;
    
    client_max_body_size 50M;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
      set $auth_service auth-service;
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://$auth_service:3000;
    }

    location /api/catalog/ {
      set $catalog_service catalog-service;
      rewrite ^/api/catalog/(.*)$ /$1 break;
      proxy_pass http://$catalog_service:3000;
    }

    location /api/orders/ {
      set $order_service order-service;
      rewrite ^/api/orders/(.*)$ /$1 break;
      proxy_pass http://$order_service:3000;
    }

    location /uploads/ {
      proxy_pass http://order-service:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/finance/ {
      set $finance_config_service finance-config-service;
      rewrite ^/api/finance/(.*)$ /$1 break;
      proxy_pass http://$finance_config_service:3000;
    }

    location = /health {
      add_header Content-Type application/json always;
      return 200 '{"status":"ok","gateway":"nginx","services":["auth","catalog","orders","finance"]}';
    }

    location / {
      add_header Content-Type application/json always;
      return 200 '{"status":"ok","message":"API Gateway is running","endpoints":["/api/auth/","/api/catalog/","/api/orders/","/api/finance/","/uploads/","/health"]}';
    }
  }
}